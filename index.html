<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Monkyfi — AI Agents for Telecom Operations</title>
<meta name="description" content="Monkyfi builds AI agents for telecom operations — from NOC automation to service delivery intelligence, field tools, and network planning." />
<link rel="canonical" href="https://monkyfi.com/" />
<meta property="og:type" content="website" />
<meta property="og:url" content="https://monkyfi.com/" />
<meta property="og:title" content="Monkyfi — AI Agents for Telecom Operations" />
<meta property="og:description" content="Monkyfi builds AI agents for telecom operations — from NOC automation to service delivery intelligence, field tools, and network planning." />
<meta property="og:image" content="https://monkyfi.com/assets/og-image.jpg" />
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:image" content="https://monkyfi.com/assets/og-image.jpg" />
<link rel="icon" href="assets/favicon-48.png" type="image/png" sizes="48x48" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet" />
<style>
:root {
  --cyan: #4FA9E8;
  --cyan-soft: rgba(79,169,232,.12);
  --navy-2: #0E1B33;
  --ink: #070B14;
  --slate: #a3b1c4;
  --muted: #8b9bb0;
  --line: rgba(148,163,184,.18);
}
:focus-visible { outline: 2px solid var(--cyan); outline-offset: 3px; border-radius: 6px; }
.req { color: #F2C98B; margin-left: 2px; }
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; scroll-padding-top: 72px; }
body {
  font-family: 'Poppins', system-ui, sans-serif;
  background: var(--ink); color: #cbd5e1;
  font-size: 16px; line-height: 1.65;
  overflow-x: hidden; -webkit-font-smoothing: antialiased;
}
a { color: inherit; text-decoration: none; }
a:hover { color: var(--cyan); }

/* NAV */
nav {
  position: sticky; top: 0; z-index: 60;
  background: rgba(7,11,20,.92); backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--line);
}
.nav-inner {
  max-width: 1200px; margin: 0 auto; padding: 14px 24px;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
}
.brand { display: flex; align-items: center; gap: 10px; }
.brand-mark {
  width: 38px; height: 38px; border-radius: 10px;
  background: radial-gradient(circle at 30% 30%, #143055, #0A1426 70%);
  border: 1px solid rgba(79,169,232,.35);
  display: flex; align-items: center; justify-content: center; overflow: hidden;
}
.brand-mark img { width: 88%; height: 88%; object-fit: contain; }
.brand-text b { color: #EDEFF2; font-weight: 700; font-size: 17px; letter-spacing: -.02em; display: block; }
.brand-text small { color: var(--cyan); font-size: 10px; letter-spacing: .28em; text-transform: uppercase; font-weight: 600; }
.nav-end { display: flex; align-items: center; gap: 10px; }
.lang-switch { display: flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.lang-switch button {
  background: transparent; border: none; color: var(--slate);
  font-family: inherit; font-size: 12px; font-weight: 600;
  padding: 8px 10px; min-height: 40px; min-width: 40px; cursor: pointer; transition: background .2s, color .2s;
}
.lang-switch button:hover { color: #EDEFF2; }
.lang-switch button[aria-pressed="true"] { background: var(--cyan-soft); color: var(--cyan); }
.nav-cta {
  padding: 9px 18px; border-radius: 8px;
  background: var(--cyan); color: var(--ink);
  font-weight: 600; font-size: 14px; white-space: nowrap;
  box-shadow: 0 0 20px rgba(79,169,232,.35);
  transition: transform .2s, box-shadow .2s;
}
.nav-cta:hover { transform: translateY(-1px); box-shadow: 0 0 32px rgba(79,169,232,.5); color: var(--ink); }
.brand-text small { white-space: nowrap; }
@media(max-width: 560px) {
  .nav-inner { padding: 10px 16px; }
  .nav-cta { padding: 9px 12px; font-size: 13px; min-height: 40px; display: inline-flex; align-items: center; }
  .brand-text small { display: none; }
  .nav-end { gap: 8px; }
  .lang-switch button { padding: 8px 7px; min-width: 34px; }
}
@media(max-width: 400px) { .brand-text { display: none; } }

/* HERO */
.hero {
  max-width: 1200px; margin: 0 auto; padding: 72px 24px 60px;
  display: grid; grid-template-columns: 1fr 1fr; gap: 48px; align-items: center;
}
@media(max-width: 760px) { .hero { grid-template-columns: 1fr; padding: 48px 16px 40px; } }
.hero-badge {
  display: inline-flex; align-items: center; gap: 7px;
  padding: 5px 12px; border-radius: 20px;
  background: var(--cyan-soft); border: 1px solid rgba(79,169,232,.25);
  font-size: 12px; font-weight: 600; color: var(--cyan);
  letter-spacing: .04em; text-transform: uppercase; margin-bottom: 20px;
}
.hero-badge span { width: 6px; height: 6px; border-radius: 50%; background: var(--cyan); animation: pulse 2s infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }
.hero h1 {
  font-size: clamp(2rem, 4vw, 3rem); font-weight: 700; color: #EDEFF2;
  line-height: 1.15; letter-spacing: -.03em; margin-bottom: 20px;
}
.hero h1 em { font-style: normal; color: var(--cyan); display: block; }
.hero p { font-size: 17px; color: var(--slate); line-height: 1.7; margin-bottom: 32px; max-width: 480px; }
.hero-actions { display: flex; gap: 12px; flex-wrap: wrap; }
.btn-primary {
  padding: 12px 24px; border-radius: 9px; background: var(--cyan); color: var(--ink);
  font-weight: 600; font-size: 15px; box-shadow: 0 0 24px rgba(79,169,232,.4);
  transition: transform .2s, box-shadow .2s;
}
.btn-primary:hover { transform: translateY(-2px); color: var(--ink); }
.btn-secondary {
  padding: 12px 24px; border-radius: 9px; border: 1px solid rgba(79,169,232,.3);
  color: var(--cyan); font-weight: 600; font-size: 15px; transition: background .2s;
}
.btn-secondary:hover { background: var(--cyan-soft); }
/* Logo with orbiting rings (from the previous site) */
.hero-visual {
  position: relative; height: 520px;
  display: flex; align-items: center; justify-content: center;
}
.orb {
  position: absolute; width: 440px; height: 440px; border-radius: 50%;
  background: radial-gradient(circle, rgba(79,169,232,.18) 0%, rgba(79,169,232,0) 60%);
  animation: float 10s ease-in-out infinite;
}
@keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }
.ring { position: absolute; border: 1px solid rgba(79,169,232,.18); border-radius: 50%; animation: spin 40s linear infinite; }
.ring.r1 { width: 480px; height: 480px; }
.ring.r2 { width: 360px; height: 360px; animation-duration: 30s; animation-direction: reverse; border-color: rgba(79,169,232,.28); }
.ring.r3 { width: 260px; height: 260px; animation-duration: 22s; border-style: dashed; border-color: rgba(79,169,232,.15); }
@keyframes spin { to { transform: rotate(360deg); } }
.ring::before {
  content: ''; position: absolute; width: 8px; height: 8px; border-radius: 50%;
  background: var(--cyan); top: -4px; left: 50%; margin-left: -4px; box-shadow: 0 0 14px var(--cyan);
}
.ring.r2::before { background: #fff; box-shadow: 0 0 10px #fff; }
.ring.r3::before { display: none; }
.hero-logo {
  position: relative; z-index: 1; width: 290px; height: 290px; border-radius: 50%;
  object-fit: cover; box-shadow: 0 0 40px rgba(79,169,232,.22), 0 0 0 1px rgba(79,169,232,.25);
}
@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  .orb, .ring, .hero-badge span { animation: none; }
  *, *::before, *::after { transition-duration: .01ms !important; }
  .agent-card:hover, .btn-primary:hover, .form-submit:hover, .nav-cta:hover { transform: none; }
}

/* Stat tiles under the hero text */
.hero-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 36px; }
.stat-card {
  --k: var(--cyan);
  background: linear-gradient(180deg, color-mix(in srgb, var(--k) 16%, transparent) 0, transparent 110px), var(--navy-2);
  border: 1px solid var(--line); border-top: 3px solid var(--k); border-radius: 12px;
  padding: 14px 16px; display: flex; flex-direction: column; gap: 6px;
}
.stat-card .stat-icon { font-size: 26px; line-height: 1.35; }
.stat-card .stat-value { font-size: 13.5px; line-height: 1.45; margin-top: 0; }

@media(max-width: 760px) {
  /* Message and CTA first; logo becomes a small accent below */
  .hero { display: flex; flex-direction: column; gap: 4px; padding-top: 28px; }
  .hero-badge { margin-bottom: 14px; }
  .hero h1 { margin-bottom: 14px; }
  .hero p { font-size: 16px; margin-bottom: 22px; }
  .hero-visual { height: 190px; width: 100%; overflow: hidden; order: 2; }
  .orb { width: 180px; height: 180px; }
  .ring.r1 { width: 180px; height: 180px; }
  .ring.r2 { width: 140px; height: 140px; }
  .ring.r3 { width: 104px; height: 104px; }
  .hero-logo { width: 96px; height: 96px; }
}
@media(max-width: 520px) { .hero-stats { grid-template-columns: 1fr; } }
.stat-card.c-green { --k: #3DDC84; }
.stat-card.c-amber { --k: #F2C98B; }
.stat-num {
  font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-weight: 600;
  font-size: clamp(2.25rem, 4.2vw, 3rem); line-height: 1.1; letter-spacing: -.02em;
  font-variant-numeric: tabular-nums; color: var(--k);
}
.stat-icon { font-size: 22px; flex-shrink: 0; }
.stat-label { font-size: 12px; color: var(--slate); text-transform: uppercase; letter-spacing: .06em; font-weight: 600; }
.stat-value { font-size: 15px; font-weight: 600; color: #EDEFF2; margin-top: 2px; }

/* SECTIONS */
.section-header { max-width: 1200px; margin: 0 auto; padding: 0 24px 32px; }
.section-label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .14em; color: var(--cyan); margin-bottom: 8px; }
.section-title { font-size: clamp(1.4rem, 2.5vw, 1.9rem); font-weight: 700; color: #EDEFF2; letter-spacing: -.02em; }
.section-sub { font-size: 15px; color: var(--slate); margin-top: 8px; max-width: 560px; }
@media(max-width: 760px) { .section-header { padding: 0 16px 28px; } }

/* AGENTS */
.agents-wrap { max-width: 1200px; margin: 0 auto; padding: 0 24px 80px; }
@media(max-width: 760px) { .agents-wrap { padding: 0 16px 60px; } }
.agents-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 320px), 1fr)); gap: 20px; }
.agent-card {
  --k: var(--cyan);
  background: linear-gradient(180deg, color-mix(in srgb, var(--k) 16%, transparent) 0, transparent 140px), var(--navy-2);
  border: 1px solid var(--line); border-top: 3px solid var(--k); border-radius: 14px;
  padding: 24px; display: flex; flex-direction: column; gap: 14px;
  transition: border-color .25s, transform .25s;
}
.agent-card:hover { border-color: color-mix(in srgb, var(--k) 45%, transparent); border-top-color: var(--k); transform: translateY(-3px); }
.agent-name::before {
  content: ''; display: inline-block; width: 9px; height: 9px; border-radius: 3px;
  background: var(--k); margin-right: 8px; vertical-align: middle; position: relative; top: -2px;
}
.agent-card .agent-icon { background: color-mix(in srgb, var(--k) 14%, transparent); border-color: color-mix(in srgb, var(--k) 30%, transparent); }
.agent-card .tag { color: var(--k); background: color-mix(in srgb, var(--k) 12%, transparent); border-color: color-mix(in srgb, var(--k) 28%, transparent); }
.c-sdi { --k: #4FA9E8; }
.c-noc { --k: #F5A9B8; }
.c-survey { --k: #FFCB9A; }
.c-field { --k: #A7E3C4; }
.c-longhaul { --k: #9CCFEF; }
.c-iq { --k: #C4B5F4; }
.c-coord { --k: #F3DE8A; }
.agent-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
.agent-icon {
  width: 44px; height: 44px; border-radius: 11px;
  background: var(--cyan-soft); border: 1px solid rgba(79,169,232,.2);
  display: flex; align-items: center; justify-content: center; font-size: 20px; flex-shrink: 0;
}
.agent-area {
  font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; color: var(--slate);
  background: rgba(148,163,184,.08); border: 1px solid var(--line); padding: 4px 9px; border-radius: 6px; text-align: right;
}
.agent-name { font-size: 17px; font-weight: 700; color: #EDEFF2; line-height: 1.3; }
.agent-desc { font-size: 13.5px; color: var(--slate); line-height: 1.6; flex-grow: 1; }
.agent-tags { display: flex; flex-wrap: wrap; gap: 6px; }
.agent-flow { list-style: none; display: flex; align-items: stretch; gap: 0; margin-top: 4px; padding: 14px 12px 12px; border-radius: 10px; background: color-mix(in srgb, var(--k) 6%, #0B1528); border: 1px solid color-mix(in srgb, var(--k) 22%, transparent); }
.agent-flow li { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; position: relative; }
.agent-flow li + li::before { content: ''; position: absolute; top: 13px; right: calc(50% + 18px); width: calc(100% - 36px); height: 2px; background: linear-gradient(90deg, color-mix(in srgb, var(--k) 25%, transparent), var(--k)); }
.agent-flow li + li::after { content: ''; position: absolute; top: 9px; right: calc(50% + 16px); border: 5px solid transparent; border-left-color: var(--k); }
.flow-n { width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; font-weight: 700; color: var(--k); border: 1.5px solid var(--k); background: #0B1528; position: relative; z-index: 1; }
.agent-flow li:last-child .flow-n { background: var(--k); color: #070B14; }
.flow-t { font-size: 11.5px; font-weight: 600; line-height: 1.3; color: #cbd5e1; padding: 0 3px; }
.tag {
  font-size: 11px; font-weight: 700; color: var(--cyan);
  background: var(--cyan-soft); border: 1px solid rgba(79,169,232,.18); padding: 3px 9px; border-radius: 5px;
}

.agent-cta {
  align-self: flex-start; display: inline-flex; align-items: center; gap: 6px; min-height: 40px;
  padding: 8px 14px; border-radius: 8px; font-family: inherit; font-size: 13.5px; font-weight: 600; cursor: pointer;
  color: var(--k); background: color-mix(in srgb, var(--k) 10%, transparent); border: 1px solid color-mix(in srgb, var(--k) 40%, transparent);
  transition: background .2s;
}
.agent-cta:hover { background: color-mix(in srgb, var(--k) 20%, transparent); color: var(--k); }

/* EXAMPLE (illustrative) */
.example-wrap { max-width: 1200px; margin: 0 auto; padding: 0 24px 80px; }
@media(max-width: 760px) { .example-wrap { padding: 0 16px 60px; } }
.example-note {
  display: inline-block; font-size: 12px; font-weight: 600; color: #F2C98B; margin-bottom: 14px;
  border: 1px dashed rgba(242,201,139,.5); border-radius: 6px; padding: 3px 10px;
}
.example-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
@media(max-width: 860px) { .example-grid { grid-template-columns: 1fr; } }
.ex-col {
  --k: var(--cyan);
  background: var(--navy-2); border: 1px solid var(--line); border-top: 3px solid var(--k); border-radius: 14px; padding: 20px;
}
.ex-col.c-chk { --k: #F2C98B; } .ex-col.c-out { --k: #3DDC84; }
.ex-step { font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--k); margin-bottom: 4px; }
.ex-col h3 { font-size: 16px; color: #EDEFF2; margin-bottom: 12px; }
.ex-list { list-style: none; display: flex; flex-direction: column; gap: 8px; font-size: 13.5px; line-height: 1.45; }
.ex-list li { display: flex; gap: 8px; align-items: flex-start; }
.ex-list .k { color: var(--muted); min-width: 92px; flex-shrink: 0; }
.ex-list .v { color: #EDEFF2; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12.5px; overflow-wrap: anywhere; }
.ex-ic { flex-shrink: 0; width: 18px; text-align: center; font-weight: 700; }
.ex-ok { color: #3DDC84; } .ex-warn { color: #F2C98B; } .ex-bad { color: #FF7A8A; }
.ex-status {
  margin-top: 14px; padding: 10px 12px; border-radius: 9px; font-size: 13px; font-weight: 600;
  color: #F2C98B; background: rgba(242,201,139,.1); border: 1px solid rgba(242,201,139,.35);
}

/* CONTACT */
.contact-section { max-width: 1200px; margin: 0 auto; padding: 0 24px 80px; }
.contact-section .section-header { padding-left: 0; padding-right: 0; }
@media(max-width: 760px) { .contact-section { padding: 0 16px 60px; } }
.contact-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 48px; align-items: start; }
@media(max-width: 760px) { .contact-grid { grid-template-columns: 1fr; gap: 28px; } }
.contact-info p { font-size: 15px; color: var(--slate); line-height: 1.7; margin-bottom: 28px; }
.contact-detail { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; font-size: 14px; }
.cd-icon {
  width: 36px; height: 36px; border-radius: 9px; background: var(--cyan-soft);
  border: 1px solid rgba(79,169,232,.18); display: flex; align-items: center; justify-content: center; font-size: 16px; flex-shrink: 0;
}
.contact-detail a { color: var(--cyan); }
.contact-form-box { background: var(--navy-2); border: 1px solid var(--line); border-radius: 16px; padding: 32px; }
@media(max-width: 500px) { .contact-form-box { padding: 22px; } }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
@media(max-width: 500px) { .form-row { grid-template-columns: 1fr; gap: 0; } }
.form-group { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
.form-group label { font-size: 12.5px; font-weight: 600; color: #cbd5e1; text-transform: uppercase; letter-spacing: .06em; }
.form-group label small { color: var(--muted); font-weight: 400; text-transform: none; letter-spacing: 0; font-size: 12.5px; }
.form-input, .form-select, .form-textarea {
  padding: 12px 14px; border-radius: 9px; width: 100%; min-height: 46px;
  background: rgba(10,20,38,.8); border: 1px solid rgba(148,163,184,.32);
  color: #EDEFF2; font-family: inherit; font-size: 16px; outline: none; transition: border-color .2s, box-shadow .2s;
}
.form-input:focus, .form-select:focus, .form-textarea:focus { border-color: var(--cyan); box-shadow: 0 0 0 3px rgba(79,169,232,.25); }
.form-input[aria-invalid="true"], .form-select[aria-invalid="true"] { border-color: #FF7A8A; }
.form-input::placeholder, .form-textarea::placeholder { color: #7d8ca2; }
.form-note { font-size: 12.5px; color: var(--muted); margin-bottom: 16px; }
.form-select { cursor: pointer; }
.form-select option { background: #0A1426; }
.form-textarea { resize: vertical; min-height: 100px; }
.hp { position: absolute; left: -9999px; width: 1px; height: 1px; opacity: 0; }
.form-submit {
  width: 100%; padding: 13px; border-radius: 9px; background: var(--cyan); color: var(--ink);
  font-weight: 600; font-size: 15px; border: none; cursor: pointer; font-family: inherit;
  box-shadow: 0 0 24px rgba(79,169,232,.35); transition: transform .2s;
}
.form-submit:hover { transform: translateY(-2px); }
.form-submit:disabled { opacity: .6; cursor: wait; transform: none; }
.form-error { color: #FF5C70; font-size: 13px; margin: 0 0 12px; min-height: 0; }
.form-error:empty { display: none; }
.form-success { text-align: center; padding: 32px 16px; display: none; }
.form-success .fs-icon { font-size: 36px; margin-bottom: 12px; }
.form-success h3 { font-size: 18px; color: var(--cyan); font-weight: 700; margin-bottom: 8px; }
.form-success p { font-size: 14px; color: var(--slate); }

/* FOOTER */
footer { border-top: 1px solid var(--line); padding: 28px 24px 96px; }
.footer-inner { max-width: 1200px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; }
.footer-left { font-size: 13px; color: var(--muted); }
.footer-right { display: flex; gap: 20px; flex-wrap: wrap; }
.footer-right a { font-size: 13px; color: var(--muted); padding: 6px 0; }
.footer-right a:hover { color: var(--cyan); }

/* CHATBOT */
.chat-fab {
  position: fixed; bottom: 28px; right: 28px; z-index: 100;
  width: 54px; height: 54px; border-radius: 50%; background: var(--cyan); border: none; cursor: pointer;
  box-shadow: 0 4px 24px rgba(79,169,232,.5); display: flex; align-items: center; justify-content: center;
  font-size: 22px; transition: transform .2s;
}
.chat-fab:hover { transform: scale(1.08); }
.chat-fab .fab-close { display: none; font-size: 20px; color: var(--ink); }
.chat-fab.open .fab-icon { display: none; }
.chat-fab.open .fab-close { display: block; }
.chat-window {
  position: fixed; bottom: 94px; right: 28px; z-index: 99;
  width: 340px; height: 480px; max-height: calc(100vh - 120px);
  background: var(--navy-2); border: 1px solid rgba(79,169,232,.25); border-radius: 18px; overflow: hidden;
  box-shadow: 0 20px 60px rgba(0,0,0,.55); display: none; flex-direction: column;
}
.chat-window.open { display: flex; }
.chat-header { padding: 14px 18px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 10px; }
.chat-avatar {
  width: 34px; height: 34px; border-radius: 50%; background: var(--cyan-soft);
  border: 1px solid rgba(79,169,232,.3); display: flex; align-items: center; justify-content: center; font-size: 16px;
}

function normalize(str) {
  return str.normalize('NFKC').replace(/[​-‍﻿]/g, '').trim();
}

// --- i18n ---
let LANG = 'en';
const t = (key) => (I18N[LANG] && I18N[LANG][key]) || I18N.en[key] || '';

function detectLang() {
  try {
    const saved = localStorage.getItem('monkyfi-lang');
    if (saved && I18N[saved]) return saved;
  } catch (e) {}
  const nav = (navigator.language || 'en').slice(0, 2).toLowerCase();
  return I18N[nav] ? nav : 'en';
}

function setLang(lang) {
  if (!I18N[lang]) return;
  LANG = lang;
  try { localStorage.setItem('monkyfi-lang', lang); } catch (e) {}
  document.documentElement.lang = lang;
  document.title = t('meta.title');
  document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });
  document.querySelectorAll('[data-i18n-ph]').forEach(el => { el.placeholder = t(el.dataset.i18nPh); });
  document.querySelectorAll('[data-i18n-aria]').forEach(el => { el.setAttribute('aria-label', t(el.dataset.i18nAria)); });
  document.querySelectorAll('.lang-switch button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.lang === lang)));
  renderAgents();
  renderInterestOptions();
  resetChat();
}

function renderAgents() {
  const grid = document.getElementById('agents-grid');
  grid.innerHTML = '';
  AGENTS.forEach((a, idx) => {
    const d = a[LANG];
    const card = document.createElement('article');
    card.className = 'agent-card ' + a.cls;
    card.innerHTML = `
      <div class="agent-top"><div class="agent-icon"></div><div class="agent-area"></div></div>
      <h3 class="agent-name"></h3>
      <p class="agent-desc"></p>
      <div class="agent-tags"></div>`;
    card.querySelector('.agent-icon').textContent = a.icon;
    card.querySelector('.agent-area').textContent = d.area;
    card.querySelector('.agent-name').textContent = d.name;
    card.querySelector('.agent-desc').textContent = d.desc;
    const tags = card.querySelector('.agent-tags');
    d.tags.forEach(tag => {
      const s = document.createElement('span');
      s.className = 'tag';
      s.textContent = tag;
      tags.appendChild(s);
    });
    const steps = FLOWS[a.cls] && (FLOWS[a.cls][LANG] || FLOWS[a.cls].en);
    if (steps) {
      const ol = document.createElement('ol');
      ol.className = 'agent-flow';
      steps.forEach((label, i) => {
        const li = document.createElement('li');
        const n = document.createElement('span'); n.className = 'flow-n'; n.textContent = i + 1;
        const tx = document.createElement('span'); tx.className = 'flow-t'; tx.textContent = label;
        li.append(n, tx);
        ol.appendChild(li);
      });
      card.appendChild(ol);
    }
    const cta = document.createElement('button');
    cta.type = 'button';
    cta.className = 'agent-cta';
    cta.textContent = t('agent.cta') + ' →';
    cta.setAttribute('aria-label', t('agent.cta') + ': ' + d.name);
    cta.addEventListener('click', () => consultAgent(idx));
    card.appendChild(cta);
    grid.appendChild(card);
  });
}

}

// --- Contact form ---
async function handleContactSubmit(e) {
  e.preventDefault();
  const form = e.target;
  const err = document.getElementById('form-error');
  const btn = form.querySelector('.form-submit');
  err.textContent = '';
  if (form.botcheck.checked) return; // honeypot: only bots tick the hidden box
  form.querySelectorAll('[required]').forEach(el => el.setAttribute('aria-invalid', String(!el.checkValidity())));
  if (!form.checkValidity()) {
    err.textContent = t('form.invalid');
    const first = form.querySelector('[aria-invalid="true"]');
    if (first) first.focus();
    return;
  }

  const fd = new FormData(form);
  const interest = form.interest.options[form.interest.selectedIndex].text;
  // Payload keys unchanged for Web3Forms: name, email, company, interest, language, message.
  const payload = {
    access_key: fd.get('access_key'),
    subject: fd.get('subject') + ' — ' + interest,
    from_name: fd.get('from_name'),
    botcheck: false,
    name: String(fd.get('full_name') || '').trim(),
    email: fd.get('email'),
    company: String(fd.get('company') || '').trim() || '(not provided)',
    interest: interest,
    language: LANG.toUpperCase(),
    message: fd.get('details') || '(no message)',
  };

  btn.disabled = true;
  btn.textContent = t('form.sending');
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), 15000);
  try {
    const res = await fetch('https://api.web3forms.com/submit', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
      body: JSON.stringify(payload),
      signal: controller.signal,
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok || !data.success) throw new Error(data.message || 'HTTP ' + res.status);
    form.reset();
    form.style.display = 'none';
    document.getElementById('form-success').style.display = 'block';
  } catch (ex) {
    err.textContent = t(ex.name === 'AbortError' ? 'form.timeout' : 'form.error');
  } finally {
    clearTimeout(timer);
    btn.disabled = false;
    btn.textContent = t('form.submit');
  }
}

// --- Chatbot ---
let chatOpen = false;
let chatAgent = null; // index of the agent the visitor picked; survives language changes

function toggleChat(force) {
  chatOpen = typeof force === 'boolean' ? force : !chatOpen;
  const fab = document.getElementById('chat-fab');
  fab.classList.toggle('open', chatOpen);
  fab.setAttribute('aria-expanded', String(chatOpen));
  document.getElementById('chat-window').classList.toggle('open', chatOpen);
  if (chatOpen) {
    if (!document.getElementById('chat-messages').children.length) initChat();
    document.getElementById('chat-input').focus();
  } else {
    fab.focus();
  }
}
document.addEventListener('keydown', e => { if (e.key === 'Escape' && chatOpen) toggleChat(false); });

function resetChat() {
  document.getElementById('chat-messages').innerHTML = '';
  document.getElementById('chat-chips').innerHTML = '';
  if (chatOpen) initChat();
}

function initChat() {
  addBotMsg(t('chat.greeting'));
  if (chatAgent !== null) { // re-render the chosen agent in the new language
    addUserMsg(AGENTS[chatAgent][LANG].name);
    addBotMsg(agentReply(AGENTS[chatAgent]));
    return;
  }
  const c = document.getElementById('chat-chips');
  CHIP_AGENTS.forEach(i => {
    const a = AGENTS[i];
    const btn = document.createElement('button');
    btn.className = 'chip';
    btn.textContent = a.icon + ' ' + a[LANG].name;
    btn.onclick = () => {
      c.innerHTML = '';
      chatAgent = i;
      addUserMsg(a[LANG].name);
      setTimeout(() => addBotMsg(agentReply(a)), 350);
    };
    c.appendChild(btn);
  });
}

// Delegated handler for the "ask about this agent" button inside bot messages.
document.getElementById('chat-messages').addEventListener('click', e => {
  const b = e.target.closest('[data-consult]');
  if (b) consultAgent(Number(b.dataset.consult));
});

// One diagnostic question per agent.
const AGENT_Q = {
  'c-sdi':      { en: 'How many service orders does your team process per month, and where do discrepancies usually show up?', es: '¿Cuántas órdenes de servicio procesa tu equipo al mes y dónde suelen aparecer las discrepancias?', pt: 'Quantas ordens de serviço sua equipe processa por mês e onde costumam aparecer as divergências?' },
  'c-noc':      { en: 'How many alarms does your NOC handle per shift, and how much of it is noise?', es: '¿Cuántas alarmas maneja tu NOC por turno y cuánto de eso es ruido?', pt: 'Quantos alarmes seu NOC trata por turno e quanto disso é ruído?' },
  'c-survey':   { en: 'How are site surveys captured today: paper, spreadsheets, or a tool?', es: '¿Cómo se registran hoy los levantamientos de sitio: papel, hojas de cálculo o alguna herramienta?', pt: 'Como os levantamentos de site são registrados hoje: papel, planilhas ou alguma ferramenta?' },
  'c-field':    { en: 'Do your technicians work across several vendors and at sites with poor connectivity?', es: '¿Tus técnicos trabajan con varios fabricantes y en sitios con mala conectividad?', pt: 'Seus técnicos trabalham com vários fabricantes e em sites com pouca conectividade?' },
  'c-longhaul': { en: 'Are you planning a terrestrial route, a submarine segment, or both?', es: '¿Estás planificando una ruta terrestre, un tramo submarino o ambos?', pt: 'Você está planejando uma rota terrestre, um trecho submarino ou ambos?' },
  'c-iq':       { en: 'Where does your carrier and cable inventory live today?', es: '¿Dónde está hoy tu inventario de carriers y cables?', pt: 'Onde está hoje o seu inventário de carriers e cabos?' },
  'c-coord':    { en: 'How many technicians and zones do you coordinate, and how do you catch schedule conflicts today?', es: '¿Cuántos técnicos y zonas coordinas y cómo detectas hoy los conflictos de agenda?', pt: 'Quantos técnicos e zonas você coordena e como detecta hoje os conflitos de agenda?' },
};

// Bot messages only ever come from our own fixed strings, never from user input.
function addBotMsg(html) {
  const el = document.createElement('div');
  el.className = 'msg bot';
  el.innerHTML = html;
  appendMsg(el);
}

// User text is always rendered as plain text.
function addUserMsg(text) {
  const el = document.createElement('div');
  el.className = 'msg user';
  el.textContent = text;
  appendMsg(el);
}

function appendMsg(el) {
  const msgs = document.getElementById('chat-messages');
  msgs.appendChild(el);
  msgs.scrollTop = msgs.scrollHeight;
}

// Built only from our own fixed strings (escaped anyway).
function agentReply(a) {
  const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;');
  const d = a[LANG];
  const idx = AGENTS.indexOf(a);
  const short = d.desc.split(/(?<=\.)\s/)[0];
  const q = AGENT_Q[a.cls] ? (AGENT_Q[a.cls][LANG] || AGENT_Q[a.cls].en) : '';
  return '<strong>' + esc(d.name) + '</strong>: ' + esc(short) +
    (q ? '<span class="chat-q">' + esc(t('chat.qIntro')) + ' ' + esc(q) + '</span>' : '') +
    '<button type="button" class="chat-act" data-consult="' + idx + '">' + esc(t('chat.ask')) + ' →</button>';
}

function sendChat() {
  const input = document.getElementById('chat-input');
  const text = normalize(input.value);
  if (!text) return;
  input.value = '';
  document.getElementById('chat-chips').innerHTML = '';
  addUserMsg(text);
  setTimeout(() => addBotMsg(respond(text)), 350);
}

function respond(text) {
  if (text.length > 500) return t('chat.tooLong');
  if (BLOCK_PATTERNS.some(r => r.test(text))) return t('chat.outOfScope');
  if (SENSITIVE_PATTERNS.some(r => r.test(text))) return t('chat.sensitive');

  const lower = text.toLowerCase();
  const agent = AGENTS.find(a => a.keys.some(k => lower.includes(k)));
  if (agent) { chatAgent = AGENTS.indexOf(agent); return agentReply(agent); }
  if (/\b(price|pricing|cost|how much|precio|costo|cuánto|preço|custo|quanto)\b/i.test(text)) return t('chat.pricing');
  if (/\b(contact|email|e-mail|correo|demo|pilot|piloto|meeting|reunión|reunião|llamada|ligação)\b/i.test(text)) return t('chat.contact');
  return t('chat.fallback');
}

setLang(detectLang());
</script>
